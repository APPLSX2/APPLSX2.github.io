# Publishes the site (the repository's root: index.html, privacy.html, assets/) to GitHub Pages
# on every push to main, or by hand from the Actions tab.
# One-time setup: Settings › Pages › Build and deployment › Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Collect the site
        run: |
          mkdir -p _site
          cp -R index.html privacy.html assets _site/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
